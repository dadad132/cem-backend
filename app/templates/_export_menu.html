{# Export dropdown: Download PDF / Download Excel, as on the ticket report.
   Expects pdf_url and excel_url. Hidden inline until Alpine runs, so it never flashes open. #}
<div class="relative" x-data="{ open: false }">
  <button type="button" @click="open = !open" @click.away="open = false"
          class="px-3 sm:px-4 py-2 bg-emerald-600 text-white rounded-lg hover:bg-emerald-700 text-sm font-medium flex items-center gap-2 whitespace-nowrap">
    <i class="fas fa-file-export"></i>
    <span>Export</span>
    <i class="fas fa-chevron-down text-xs"></i>
  </button>
  <div x-show="open" style="display: none;"
       class="absolute right-0 mt-2 w-48 bg-white rounded-lg shadow-lg border border-gray-200 py-1 z-50">
    <a href="{{ pdf_url }}" class="flex items-center gap-3 px-4 py-2 text-gray-700 hover:bg-gray-100">
      <i class="fas fa-file-pdf text-red-500 w-5 text-center"></i>
      <span>Download PDF</span>
    </a>
    <a href="{{ excel_url }}" class="flex items-center gap-3 px-4 py-2 text-gray-700 hover:bg-gray-100">
      <i class="fas fa-file-excel text-green-600 w-5 text-center"></i>
      <span>Download Excel</span>
    </a>
  </div>
</div>
